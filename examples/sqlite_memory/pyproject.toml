[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thinkstack-sqlite-memory"
version = "1.0.0"
description = "ThinkStack 示例扩展：基于 SQLite 的长期记忆后端"
requires-python = ">=3.10"
dependencies = [
    "thinkstack>=1.0.0",
]

[tool.setuptools]
py-modules = ["sqlite_memory"]

# 接入方式（代码示例）：
#   from thinkstack import ThinkStack
#   stack = ThinkStack()
#   stack.register_extension("sqlite_memory", "/path/to/sqlite_memory.py")
#   stack.start()  # 应用后 stack.long_term_memory 将被替换为 SQLite 后端
#   stack.store_long_term("user", {"name": "陌老师"})
