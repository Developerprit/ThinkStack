[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thinkstack-round-robin-scheduler"
version = "1.0.0"
description = "ThinkStack 示例扩展：基于时间片轮转的调度器"
requires-python = ">=3.10"
dependencies = [
    "thinkstack>=1.0.0",
]

[tool.setuptools]
py-modules = ["round_robin"]

