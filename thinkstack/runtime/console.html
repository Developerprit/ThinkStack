<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ThinkStack 控制台</title>
<style>
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #eef0f4;
  --text: #1a1d24;
  --text-muted: #6b7280;
  --border: #e2e5ea;
  --accent: #4f46e5;
  --accent-2: #6366f1;
  --ok: #16a34a;
  --err: #dc2626;
  --shadow: 0 1px 3px rgba(16, 24, 40, .06), 0 1px 2px rgba(16, 24, 40, .04);
}
html[data-theme="dark"] {
  --bg: #0f1117;
  --surface: #171a21;
  --surface-2: #1f232d;
  --text: #e6e8ee;
  --text-muted: #9aa1ad;
  --border: #2a2f3a;
  --accent: #818cf8;
  --accent-2: #a5b4fc;
  --ok: #4ade80;
  --err: #f87171;
  --shadow: 0 1px 3px rgba(0,0,0,.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background .2s, color .2s;
}
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 28px; background: var(--surface);
  border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10;
}
.brand { font-size: 18px; font-weight: 700; letter-spacing: .3px; }
.brand span { color: var(--accent); font-weight: 500; }
.brand .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
  background: var(--ok); margin-right: 8px; }
.actions { display: flex; gap: 10px; }
button {
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
  padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
  transition: transform .05s, background .15s;
}
button:hover { background: var(--border); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.primary:hover { background: var(--accent-2); }
main { max-width: 1080px; margin: 0 auto; padding: 24px 28px 60px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 22px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px 18px; box-shadow: var(--shadow); }
.card .label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
.card .value { font-size: 22px; font-weight: 700; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 22px; }
@media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 18px; box-shadow: var(--shadow); margin-bottom: 16px; }
.panel h2 { font-size: 15px; margin-bottom: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
th { color: var(--text-muted); font-weight: 500; }
.badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px;
  background: var(--surface-2); border: 1px solid var(--border); }
.badge.on { color: var(--ok); border-color: var(--ok); }
.badge.off { color: var(--err); border-color: var(--err); }
.row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }
input, select, textarea {
  background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 13px; font-family: inherit; outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
textarea { width: 100%; min-height: 70px; resize: vertical; }
pre { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px; font-size: 12px; overflow: auto; white-space: pre-wrap; word-break: break-all;
  font-family: "Cascadia Code", Consolas, monospace; }
.muted { color: var(--text-muted); font-size: 12px; }
.chip { display: inline-block; margin: 2px 4px 2px 0; padding: 3px 8px; border-radius: 6px;
  background: var(--surface-2); border: 1px solid var(--border); font-size: 12px; }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span>ThinkStack <span>· 控制台</span></div>
  <div class="actions">
    <button id="refreshBtn">刷新</button>
    <button id="themeToggle">切换深色</button>
  </div>
</header>
<main>
  <section class="cards" id="cards"></section>

  <section class="grid">
    <div class="panel">
      <h2>已注册工具</h2>
      <div id="tools"></div>
    </div>
    <div class="panel">
      <h2>已加载扩展</h2>
      <div id="extensions"></div>
    </div>
  </section>

  <section class="panel">
    <h2>运行 Agent</h2>
    <div class="row">
      <select id="agentSelect">
        <option value="echo">echo（回显）</option>
        <option value="tool-calling">tool-calling（工具调用）</option>
        <option value="markdown">markdown（MD→HTML）</option>
      </select>
      <input id="maxIter" type="number" value="5" min="1" style="width:90px" title="最大迭代次数" />
      <button class="primary" id="runAgentBtn">运行</button>
    </div>
    <textarea id="agentInput" placeholder="输入任务，例如：tool:echo_tool message=你好"></textarea>
    <pre id="agentOutput" class="muted">运行结果将显示在这里…</pre>
  </section>

  <section class="panel">
    <h2>调用工具</h2>
    <div class="row">
      <select id="toolSelect"></select>
      <input id="toolArgs" placeholder='参数 JSON，例如 {"message":"你好"}' style="flex:1; min-width:200px" />
      <button class="primary" id="callToolBtn">调用</button>
    </div>
    <pre id="toolOutput" class="muted">工具调用结果将显示在这里…</pre>
  </section>

  <section class="panel">
    <h2>Markdown 渲染（MD → HTML）</h2>
    <div class="row">
      <button class="primary" id="renderMdBtn">渲染</button>
      <button id="renderMdPreviewBtn">预览</button>
    </div>
    <textarea id="mdInput" placeholder="输入 Markdown，例如：# 标题&#10;&#10;**加粗** 和 *斜体* 与 `行内代码`"># 你好 ThinkStack

这是 **Markdown**，会自动转成 HTML。

- 列表项一
- 列表项二

`行内代码` 与代码块：

```
print("hello")
```</textarea>
    <pre id="mdOutput" class="muted">渲染后的 HTML 将显示在这里…</pre>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
const api = async (path, opts) => {
  const res = await fetch(path, opts);
  return res.json();
};

function initTheme() {
  const saved = localStorage.getItem("ts-theme") || "light";
  document.documentElement.setAttribute("data-theme", saved);
  $("themeToggle").textContent = saved === "dark" ? "切换浅色" : "切换深色";
}
$("themeToggle").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("ts-theme", next);
  $("themeToggle").textContent = next === "dark" ? "切换浅色" : "切换深色";
});

async function refreshInfo() {
  const info = await api("/api/info");
  const cards = $("cards");
  cards.innerHTML = "";
  const items = [
    ["运行状态", info.running ? "运行中" : "已停止"],
    ["工具数量", info.tool_count],
    ["扩展数量", info.extension_count],
    ["调度策略", info.scheduler],
    ["最大迭代", info.max_iterations],
  ];
  for (const [label, value] of items) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<div class="label">${label}</div><div class="value">${value}</div>`;
    cards.appendChild(card);
  }
}

async function refreshTools() {
  const data = await api("/api/tools");
  const tools = data.tools || [];
  const box = $("tools");
  const sel = $("toolSelect");
  sel.innerHTML = "";
  if (!tools.length) {
    box.innerHTML = '<p class="muted">暂无工具</p>';
    return;
  }
  box.innerHTML = "<table><tr><th>名称</th><th>说明</th><th>类型</th></tr>" +
    tools.map(t => `<tr><td>${esc(t.name)}</td><td>${esc(t.description) || "—"}</td>
      <td><span class="badge">${t.is_async ? "异步" : "同步"}</span></td></tr>`).join("") +
    "</table>";
  for (const t of tools) {
    const opt = document.createElement("option");
    opt.value = t.name;
    opt.textContent = t.name;
    sel.appendChild(opt);
  }
}

async function refreshExtensions() {
  const data = await api("/api/extensions");
  const exts = data.extensions || [];
  const box = $("extensions");
  if (!exts.length) {
    box.innerHTML = '<p class="muted">暂无扩展</p>';
    return;
  }
  box.innerHTML = exts.map(e => `
    <div style="padding:6px 0;border-bottom:1px solid var(--border)">
      <strong>${esc(e.name)}</strong>
      <span class="badge ${e.is_active ? "on" : "off"}">${e.is_active ? "启用" : "停用"}</span>
      <div>${(e.hooks || []).map(h => `<span class="chip">${esc(h)}</span>`).join("")}</div>
    </div>`).join("");
}

$("refreshBtn").addEventListener("click", () => { refreshInfo(); refreshTools(); refreshExtensions(); });
$("runAgentBtn").addEventListener("click", async () => {
  const out = $("agentOutput");
  out.textContent = "运行中…";
  const body = {
    agent: $("agentSelect").value,
    input: $("agentInput").value,
    max_iterations: parseInt($("maxIter").value, 10) || 5,
  };
  const res = await api("/api/agent/run", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  out.textContent = JSON.stringify(res, null, 2);
});
$("callToolBtn").addEventListener("click", async () => {
  const out = $("toolOutput");
  out.textContent = "调用中…";
  let args = {};
  try { args = JSON.parse($("toolArgs").value || "{}"); }
  catch { args = { raw: $("toolArgs").value }; }
  const res = await api("/api/tools/call", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: $("toolSelect").value, args }),
  });
  out.textContent = JSON.stringify(res, null, 2);
});

async function renderMarkdown(showPreview) {
  const out = $("mdOutput");
  const text = $("mdInput").value;
  const res = await api("/api/markdown/render", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text }),
  });
  if (showPreview && res.html) {
    out.textContent = "";
    out.innerHTML = res.html;
  } else {
    out.textContent = JSON.stringify(res, null, 2);
  }
}
$("renderMdBtn").addEventListener("click", () => renderMarkdown(false));
$("renderMdPreviewBtn").addEventListener("click", () => renderMarkdown(true));

initTheme();
refreshInfo();
refreshTools();
refreshExtensions();
</script>
</body>
</html>
